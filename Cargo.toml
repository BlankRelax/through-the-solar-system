[package]
name = "through-the-solar-system"
version = "0.1.0"
edition = "2021"
description = "An annotated first-person flight through the Solar System, in Rust and WebGL2"
license = "MIT"
repository = "https://github.com/BlankRelax/through-the-solar-system"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glam = "0.29"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# wasm-bindgen must match the wasm-bindgen CLI used by scripts/build.mjs exactly.
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "AddEventListenerOptions",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "HtmlButtonElement",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlImageElement",
  "KeyboardEvent",
  "MediaQueryList",
  "MouseEvent",
  "Node",
  "Performance",
  "PointerEvent",
  "Storage",
  "WebGl2RenderingContext",
  "WebGlBuffer",
  "WebGlProgram",
  "WebGlShader",
  "WebGlTexture",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
  "WheelEvent",
  "Window",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
